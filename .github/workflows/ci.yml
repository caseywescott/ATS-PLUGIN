name: CI

on:
  push:
    branches: [master, main, remove-juce]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-core
            os: ubuntu-latest
            build_plugin: "OFF"
            ui_probe: "OFF"
          - name: macos-wrappers
            os: macos-latest
            build_plugin: "ON"
            ui_probe: "OFF"
          # The Visage editor + page/dispatch tests. Tests labelled `windowed`
          # (need an on-screen window) or `perf` (wall-clock budgets) run
          # locally, not on shared runners.
          - name: macos-ui-probe
            os: macos-latest
            build_plugin: "OFF"
            ui_probe: "ON"
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Pinned upstream base; patches/ carries every local ATSA change on top of
      # it (see patches/README.md). Unpinned HEAD drifts and breaks the stack.
      - name: Clone Qatsh (ATSA + synthesis sources)
        run: |
          git clone https://gitlab.com/dxarts/projects/ats/qatsh.git qatsh
          git -C qatsh checkout --detach 5515648358ffaa8d863b3f2507e03a4943d79667

      - name: Apply Qatsh vendor patches
        run: ./scripts/apply_qatsh_all_patches.sh

      - name: Install libsndfile (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1-dev

      - name: Install libsndfile (macOS)
        if: runner.os == 'macOS'
        run: brew install libsndfile

      # Pinned VST3 SDK / AudioUnitSDK / Visage checkouts. The key hashes the
      # files that carry the pins, so a pin bump fetches fresh sources.
      - name: Cache pinned FetchContent sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'cmake/ATSVst3Sdk.cmake', 'cmake/ATSAudioUnitSdk.cmake') }}

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PLUGIN=${{ matrix.build_plugin }} \
            -DATS_BUILD_VISAGE_UI_PROBE=${{ matrix.ui_probe }} \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.deps"
          cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -LE 'windowed|perf'
